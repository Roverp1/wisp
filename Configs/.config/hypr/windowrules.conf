# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█


windowrule = match:float false, no_shadow on

windowrule = match:class ^([Ss]potify)$, opacity 0.9

# --- Tearing ---
windowrule = match:title .*\.exe, immediate on
windowrule = match:title .*minecraft.*, immediate on
windowrule = match:class ^(steam_app).*, immediate on

# idleinhibit rules
windowrule = match:class ^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$, idle_inhibit fullscreen
windowrule = match:class ^(.*[Ss]potify.*)$, idle_inhibit fullscreen
windowrule = match:class ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*brave-browser.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen.*)$|^(.*vivaldi.*)$, idle_inhibit fullscreen

# Picture-in-Picture
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on, keep_aspect_ratio on, move (monitor_w*0.73) (monitor_h*0.72), size (monitor_w*0.25) (monitor_h*0.25), pin on

windowrule = match:class tremc-magnet, float on, center on, size (monitor_w*0.80) (monitor_h*0.70)

# Floating
windowrule = match:title ^(Open File)(.*)$, float on, center on
windowrule = match:title ^(Select a File)(.*)$, float on, center on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on, center on, size (monitor_w*0.60) (monitor_h*0.65)
windowrule = match:title ^(Open Folder)(.*)$, float on, center on
windowrule = match:title ^(Save As)(.*)$, float on, center on
windowrule = match:title ^(Library)(.*)$, float on, center on
windowrule = match:title ^(File Upload)(.*)$, float on, center on
windowrule = match:title ^(.*)(wants to save)$, float on, center on
windowrule = match:title ^(.*)(wants to open)$, float on, center on
windowrule = match:class ^(blueberry\.py)$, float on
windowrule = match:class ^(guifetch)$, float on
windowrule = match:class ^(pavucontrol)$, float on, center on, size (monitor_w*0.45) (monitor_h*0.45)
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on, center on, size (monitor_w*0.45) (monitor_h*0.45)
windowrule = match:class ^(nm-connection-editor)$, float on, center on, size (monitor_w*0.45) (monitor_h*0.45)
windowrule = match:class .*plasmawindowed.*, float on
windowrule = match:class kcm_.*, float on
windowrule = match:class .*bluedevilwizard, float on
windowrule = match:title .*Welcome, float on
windowrule = match:title ^(illogical-impulse Settings)$, float on
windowrule = match:title .*Shell conflicts.*, float on
windowrule = match:class org.freedesktop.impl.portal.desktop.kde, float on, size (monitor_w*0.60) (monitor_h*0.65)
windowrule = match:class ^(Zotero)$, float on, size (monitor_w*0.45) (monitor_h*0.45)

windowrule = match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog — Dolphin)$, float on
windowrule = match:class ^(org.kde.dolphin)$, match:title ^(Copying — Dolphin)$, float on
windowrule = match:title ^(About Mozilla Firefox)$, float on
windowrule = match:class ^(firefox)$, match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(firefox)$, match:title ^(Library)$, float on
windowrule = match:class ^(kitty)$, match:title ^(top)$, float on
windowrule = match:class ^(kitty)$, match:title ^(btop)$, float on
windowrule = match:class ^(kitty)$, match:title ^(htop)$, float on
windowrule = match:class ^(vlc)$, float on
windowrule = match:class ^(kvantummanager)$, float on
windowrule = match:class ^(qt5ct)$, float on
windowrule = match:class ^(qt6ct)$, float on
windowrule = match:class ^(nwg-look)$, float on
windowrule = match:class ^(org.kde.ark)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-applet)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

windowrule = match:class ^(Signal)$, float on
windowrule = match:class ^(com.github.rafostar.Clapper)$, float on
windowrule = match:class ^(app.drey.Warp)$, float on
windowrule = match:class ^(net.davidotek.pupgui2)$, float on
windowrule = match:class ^(yad)$, float on
windowrule = match:class ^(eog)$, float on
windowrule = match:class ^(io.github.alainm23.planify)$, float on
windowrule = match:class ^(io.gitlab.theevilskeleton.Upscaler)$, float on
windowrule = match:class ^(com.github.unrud.VideoDownloader)$, float on
windowrule = match:class ^(io.gitlab.adhami3310.Impression)$, float on
windowrule = match:class ^(io.missioncenter.MissionCenter)$, float on

# common modals
windowrule = match:title ^(Open)$, float on
windowrule = match:title ^(Authentication Required)$, float on
windowrule = match:title ^(Add Folder to Workspace)$, float on
windowrule = match:initial_title ^(Open File)$, float on
windowrule = match:title ^(Choose Files)$, float on
windowrule = match:title ^(Save As)$, float on
windowrule = match:title ^(Confirm to replace files)$, float on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^([Xx]dg-desktop-portal-gtk)$, float on
windowrule = match:title ^(File Upload)(.*)$, float on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on
windowrule = match:title ^(Library)(.*)$, float on
windowrule = match:class ^(.*dialog.*)$, float on
windowrule = match:title ^(.*dialog.*)$, float on

# workaround for jetbrains IDEs dropdowns/popups cause flickering
windowrule = match:class ^(.*jetbrains.*)$, match:title ^(win[0-9]+)$, no_initial_focus on

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur on, ignore_alpha 0, match:namespace rofi
layerrule = blur on, ignore_alpha 0, match:namespace notifications
layerrule = blur on, ignore_alpha 0, match:namespace swaync-notification-window
layerrule = blur on, ignore_alpha 0, match:namespace swaync-control-center
layerrule = blur on, match:namespace logout_dialog
